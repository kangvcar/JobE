[project]
name = "jobe-backend"
version = "0.1.0"
description = "职途罗盘 JobE — 多源异构数据驱动的岗位能力图谱与动态演化分析"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "tenacity>=9.0",
    "openai>=1.60",
    "neo4j>=5.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "rapidfuzz>=3.11",
    "datasketch>=1.6.5",
    "numpy>=2.2",
    "pandas>=2.2",
    "scipy>=1.15",
    "statsmodels>=0.14",
    "pymannkendall>=1.4.3",
    "networkx>=3.4",
    "pdfplumber>=0.11",
    "pyjwt>=2.10",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
# 版面解析。体积大，默认不装；抽取模块须在缺失时优雅降级。
docparse = ["magic-pdf>=1.0", "pillow>=11.0"]
# 商业平台采集适配器，默认关闭（见 ADR 0001）
browser = ["playwright>=1.49"]
# 技能点向量，用于别名归一召回
embed = ["FlagEmbedding>=1.3", "torch>=2.5"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "faker>=33.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# importlib 模式：各模块的测试目录里存在同名文件（如多个 test_router.py），
# 默认的 prepend 模式会因模块名冲突拒绝收集。
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
